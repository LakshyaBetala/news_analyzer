name: CI

on:
  push:
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest tests/ -v
      - name: Quality gate (accuracy on labeled articles)
        run: python eval/run_eval.py --out eval_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-result
          path: eval_result.json

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-gate
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test the container
        run: |
          docker build -t news-analyzer:ci .
          docker run -d -p 8000:8000 --name app news-analyzer:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/api/health && break || sleep 2; done
          python scripts/smoke_test.py http://localhost:8000

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate
