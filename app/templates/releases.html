<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Control Room</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --mute:#94a3b8;
          --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,Segoe UI,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:26px; }
  a { color:var(--accent); }
  .sub { color:var(--mute); margin:4px 0 20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat b { display:block; font-size:26px; }
  .stat span { color:var(--mute); font-size:13px; }
  .rel { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--mute);
         border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .rel.PROMOTED { border-left-color:var(--ok); }
  .rel.BLOCKED, .rel.ROLLED_BACK { border-left-color:var(--bad); }
  .top { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; align-items:center; }
  .ver { font-weight:700; font-size:17px; }
  .badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--line); }
  .PROMOTED .badge { background:var(--ok); color:#052e16; }
  .BLOCKED .badge, .ROLLED_BACK .badge { background:var(--bad); color:#fff; }
  .meta { color:var(--mute); font-size:13px; margin-top:2px; }
  .metrics { display:flex; flex-wrap:wrap; gap:18px; margin:10px 0 6px; font-size:14px; }
  .metrics div span { color:var(--mute); }
  .why { margin-top:6px; padding:8px 10px; background:#0b1220; border-radius:8px; font-size:14px; }
  .empty { text-align:center; color:var(--mute); padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Release Control Room</h1>
    <a href="/">&larr; Back to the Analyzer (running v{{ version }})</a>
  </header>
  <p class="sub">Every push is scored on accuracy against a labeled article set before it is allowed to ship.</p>
  <div class="stats" id="stats"></div>
  <div id="list"><div class="empty">Loading releases&hellip;</div></div>
</div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => (v == null ? '&ndash;' : Math.round(v * 100) + '%');

function render(rels) {
  rels = rels.slice().reverse();
  const shipped = rels.filter(r => r.status === 'PROMOTED').length;
  const stopped = rels.length - shipped;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${rels.length}</b><span>Releases</span></div>
     <div class="stat"><b style="color:var(--ok)">${shipped}</b><span>Promoted</span></div>
     <div class="stat"><b style="color:var(--bad)">${stopped}</b><span>Blocked / rolled back</span></div>
     <div class="stat"><b>${rels.length ? pct(rels.find(r => r.status === 'PROMOTED')?.accuracy) : '&ndash;'}</b><span>Live accuracy</span></div>`;
  if (!rels.length) {
    document.getElementById('list').innerHTML = '<div class="empty">No releases recorded yet. Push a commit and let Jenkins run.</div>';
    return;
  }
  document.getElementById('list').innerHTML = rels.map(r => `
    <div class="rel ${esc(r.status)}">
      <div class="top"><span class="ver">v${esc(r.version)}</span><span class="badge">${esc(r.status.replace('_',' '))}</span></div>
      <div class="meta">${esc(r.time || '')} &middot; commit ${esc(r.commit || '?')} &middot; ${esc(r.message || '')}</div>
      <div class="metrics">
        <div><span>Accuracy </span><b>${pct(r.accuracy)}</b>${r.baseline_accuracy != null ? ` <span>(prev ${pct(r.baseline_accuracy)})</span>` : ''}</div>
        <div><span>Avg latency </span><b>${r.latency_ms != null ? r.latency_ms + ' ms' : '&ndash;'}</b></div>
        <div><span>EC2 CPU </span><b>${r.cpu_percent != null ? r.cpu_percent + '%' : '&ndash;'}</b></div>
      </div>
      <div class="why">${esc(r.verdict || '')}</div>
    </div>`).join('');
}

fetch('/api/releases').then(r => r.json()).then(render).catch(() => render([]));
setInterval(() => fetch('/api/releases').then(r => r.json()).then(render).catch(() => {}), 15000);
</script>
</body>
</html>
