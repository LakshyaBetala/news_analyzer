<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CloudForge AI · News Credibility Analyzer</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --mute:#94a3b8;
          --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --accent:#38bdf8; --field:#0b1220; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,Segoe UI,sans-serif; }
  a { color:var(--accent); }
  nav { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
        max-width:1100px; margin:0 auto; padding:16px; border-bottom:1px solid var(--line); }
  .brand { font-weight:700; font-size:18px; letter-spacing:.3px; }
  .brand span { color:var(--accent); }
  .links { display:flex; gap:18px; align-items:center; font-size:14px; }
  .links a { text-decoration:none; color:var(--mute); }
  .links a.on { color:var(--text); font-weight:600; }
  .ver { font-size:12px; color:var(--mute); border:1px solid var(--line); border-radius:99px; padding:2px 10px; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:26px; }
  .sub { color:var(--mute); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--mute); margin:12px 0 6px; }
  label:first-of-type { margin-top:0; }
  input, textarea { width:100%; background:var(--field); color:var(--text); border:1px solid var(--line);
                    border-radius:8px; padding:10px 12px; font:inherit; }
  textarea { min-height:170px; resize:vertical; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .samples { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .hint { font-size:13px; color:var(--mute); }
  .chip { background:transparent; color:var(--mute); border:1px solid var(--line); border-radius:99px;
          padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .chip:hover { color:var(--text); border-color:var(--mute); }
  .go { margin-top:16px; width:100%; background:var(--accent); color:#0f172a; border:0; border-radius:8px;
        padding:12px; font:inherit; font-weight:700; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:wait; }
  .empty { color:var(--mute); text-align:center; padding:60px 10px; }
  .score { display:flex; align-items:baseline; gap:12px; }
  .score b { font-size:56px; line-height:1; }
  .verdict { font-weight:700; padding:3px 10px; border-radius:99px; font-size:13px; }
  .high .verdict { background:var(--ok); color:#052e16; }  .high b { color:var(--ok); }
  .mid .verdict  { background:var(--warn); color:#2a1a02; } .mid b  { color:var(--warn); }
  .low .verdict  { background:var(--bad); color:#fff; }     .low b  { color:#f87171; }
  .meter { height:10px; background:var(--field); border-radius:99px; margin:12px 0 4px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; border-radius:99px; transition:width .5s ease; }
  .high .meter i { background:var(--ok); } .mid .meter i { background:var(--warn); } .low .meter i { background:var(--bad); }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--mute); }
  h2 { font-size:14px; color:var(--mute); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.6px; }
  ul { margin:0; padding-left:18px; } li { margin:4px 0; }
  .signals { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:520px) { .signals { grid-template-columns:repeat(2,1fr); } }
  .sig { background:var(--field); border-radius:8px; padding:10px; text-align:center; }
  .sig b { display:block; font-size:22px; }
  .sig span { font-size:12px; color:var(--mute); }
  .err { background:#3b1111; border:1px solid var(--bad); color:#fecaca; border-radius:8px; padding:10px 12px; margin-top:12px; }
  .note { color:var(--mute); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<nav>
  <div class="brand">Cloud<span>Forge</span> AI</div>
  <div class="links">
    <a href="/" class="on">Analyzer</a>
    <a href="/releases">Release Control Room</a>
    <a href="/platform">Platform</a>
    <a href="/docs">API</a>
    <span class="ver">v{{ version }}</span>
  </div>
</nav>
<div class="wrap">
  <h1>News Credibility Analyzer</h1>
  <p class="sub">Paste an article to get a credibility score, the warning signs found and what to check next.</p>
  <div class="grid">
    <form class="card" id="form">
      <div class="samples" aria-label="Load a sample article">
        <span class="hint">Try a sample:</span>
        <button type="button" class="chip" data-sample="fake">Clickbait</button>
        <button type="button" class="chip" data-sample="mixed">Borderline</button>
        <button type="button" class="chip" data-sample="real">News report</button>
        <button type="button" class="chip" data-sample="any">Surprise me</button>
      </div>
      <label for="title">Title</label>
      <input id="title" required maxlength="500" placeholder="Article headline">
      <label for="content">Content</label>
      <textarea id="content" required placeholder="Paste the article text"></textarea>
      <label for="source">Source (optional)</label>
      <input id="source" maxlength="200" placeholder="e.g. Reuters, BBC">
      <button class="go" id="go">Analyze credibility</button>
      <div class="err" id="err" role="alert" hidden></div>
    </form>
    <section class="card" id="out" aria-live="polite">
      <div class="empty">Paste an article or load a sample, then press <b>Analyze credibility</b>.</div>
    </section>
  </div>
</div>
<script>
const SAMPLES = {{ samples | tojson }};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let last = null;
document.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => {
  const pool = b.dataset.sample === 'any' ? Object.values(SAMPLES).flat() : SAMPLES[b.dataset.sample];
  let s;
  do { s = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && s === last);
  last = s;
  $('title').value = s.title; $('content').value = s.content; $('source').value = s.source;
  $('out').innerHTML = '<div class="empty">Sample loaded. Press <b>Analyze credibility</b> to score it.</div>';
  $('go').focus();
});

$('form').onsubmit = async e => {
  e.preventDefault();
  $('go').disabled = true; $('go').textContent = 'Analyzing…'; $('err').hidden = true;
  try {
    const r = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: $('title').value, content: $('content').value, source: $('source').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Please fill in the title and content.');
    show(d);
  } catch (ex) {
    $('err').textContent = ex.message || 'Could not reach the service.'; $('err').hidden = false;
  } finally {
    $('go').disabled = false; $('go').textContent = 'Analyze credibility';
  }
};

function show(d) {
  const s = d.credibility_score;
  const [cls, label] = s >= 60 ? ['high', 'Likely credible'] : s >= 40 ? ['mid', 'Treat with caution'] : ['low', 'Low credibility'];
  const a = d.analysis_details || {};
  const sig = (n, t) => `<div class="sig"><b>${esc(n ?? 0)}</b><span>${t}</span></div>`;
  $('out').innerHTML = `
    <div class="${cls}">
      <div class="score"><b>${s.toFixed(0)}</b><span>/ 100</span><span class="verdict">${label}</span></div>
      <div class="meter" role="img" aria-label="Score ${s.toFixed(0)} out of 100"><i></i></div>
      <div class="scale"><span>0 · low</span><span>60 · credible threshold</span><span>100</span></div>
    </div>
    <h2>Signals found</h2>
    <div class="signals">${sig(a.credible_indicators, 'Credible words')}${sig(a.suspicious_indicators, 'Suspicious words')}${sig(a.emotional_manipulation, 'Emotional patterns')}${sig(a.source_credibility, 'Source score')}</div>
    <h2>Risk factors</h2><ul>${d.risk_factors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h2>Recommendations</h2><ul>${d.recommendations.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <p class="note">A heuristic screening aid, not a fact-check. Served by release v${esc(d.version)}.</p>`;
  requestAnimationFrame(() => { $('out').querySelector('.meter i').style.width = s + '%'; });
}
</script>
</body>
</html>
